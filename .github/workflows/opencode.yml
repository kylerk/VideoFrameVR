name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  settings:
    uses: ./.github/workflows/opencode-settings.yml

  opencode:
    needs: settings
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare OpenCode auth
        shell: bash
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
        run: |
          set -euo pipefail
          umask 077

          auth_dir="$HOME/.local/share/opencode"
          auth_file="$auth_dir/auth.json"
          install -d -m 700 "$auth_dir"
          printf '%s' "$OPENCODE_AUTH_CONTENT" | jq -e . > "$auth_file"
          chmod 600 "$auth_file"
          filtered_auth="$(jq -ce 'if .openai then {openai: .openai} else empty end' "$auth_file")"
          echo "OPENCODE_AUTH_HASH=$(printf '%s' "$filtered_auth" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # The comment is the agent's prompt, so repository rules go in an instructions file.
      - name: Prepare repository instructions
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/opencode-repository-instructions.md" <<'EOF'
          # Repository instructions

          - Never add unit tests, regression tests, test targets, test frameworks or fixtures. The project has no test code by policy.
          - Keep changes consistent with the surrounding code. The app is one C++17 executable; CMake lists every source file and shader explicitly, so new `.cpp` files and `shaders/` stages must be added to `CMakeLists.txt`.
          - Write pull request titles as user-facing changes; release notes are generated from them.
          - Every pull request body must disclose AI use, or the AI disclosure check fails. Use the template in `.github/pull_request_template.md`, tick "AI used" and name the model and harness on that line, for example `- [x] AI used. Model and harness: <model> in OpenCode (GitHub Actions)`.
          - Say in the pull request body that the change has not been tested on a headset when it affects playback, rendering, input or the menu.
          EOF

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_PERMISSION: '{"*":"allow","doom_loop":"deny","question":"deny"}'
          OPENCODE_CONFIG_CONTENT: |
            {
              "instructions": ["${{ runner.temp }}/opencode-repository-instructions.md"],
              "provider": {
                "openai": {
                  "models": {
                    "${{ needs.settings.outputs.model }}": {
                      "options": {
                        "reasoningEffort": "${{ needs.settings.outputs.variant }}"
                      }
                    }
                  }
                }
              }
            }
        with:
          model: openai/${{ needs.settings.outputs.model }}
          variant: ${{ needs.settings.outputs.variant }}
          mentions: /opencode,/oc
          share: false

      - name: Persist rotated OpenCode auth
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          auth_file="$HOME/.local/share/opencode/auth.json"
          if [ ! -s "$auth_file" ]; then
            echo "::notice::OpenCode auth file was not updated; skipping auth persistence."
            exit 0
          fi

          filtered_auth="$(jq -ce 'if .openai then {openai: .openai} else empty end' "$auth_file")" || {
            echo "::warning::OpenCode auth file does not contain OpenAI auth; skipping auth persistence."
            exit 0
          }
          echo "::add-mask::$filtered_auth"

          current_auth_hash="$(printf '%s' "$filtered_auth" | sha256sum | cut -d' ' -f1)"
          if [ "$current_auth_hash" = "${OPENCODE_AUTH_HASH:-}" ]; then
            echo "::notice::OpenCode auth did not change; skipping auth persistence."
            exit 0
          fi

          oidc_response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=opencode-github-action")"
          oidc_token="$(jq -r '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          app_response="$(curl -fsSL -X POST -H "Authorization: Bearer $oidc_token" https://api.opencode.ai/exchange_github_app_token)"
          app_token="$(jq -r '.token' <<<"$app_response")"
          echo "::add-mask::$app_token"

          printf '%s' "$filtered_auth" | GH_TOKEN="$app_token" gh secret set OPENCODE_AUTH_CONTENT --repo "$GITHUB_REPOSITORY"
