name: AI disclosure

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: python3 {0}
        run: |
          import os, re, sys
          body = os.environ.get("BODY") or ""
          none = re.search(r"^- \[[xX]\] None\b", body, re.M)
          used = re.search(r"^- \[[xX]\] AI used\. Model and harness:[ \t]*(\S.*)$", body, re.M)
          # The disclosure block that agents add: a table with at least one model row and the harness.
          block = re.search(r"\*\*AI disclosure\*\*", body) and re.search(
              r"^> \| `[^`]+` \|", body, re.M) and re.search(r"Agent harness", body)
          if none and used:
              sys.exit("Tick only one AI use box.")
          if none or used or block:
              print("AI use is disclosed.")
              sys.exit(0)
          sys.exit("Say whether AI wrote any of this PR: tick \"None\", or tick \"AI used\" and "
                   "name the model and the harness (see CONTRIBUTING.md).")
